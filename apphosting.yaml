# Firebase App Hosting — configuration de production (Next.js SSR).
# Les valeurs NEXT_PUBLIC_* sont publiques par nature ; les secrets serveur
# passent par Cloud Secret Manager (`firebase apphosting:secrets:set`).
runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_DATA_MODE
    value: firebase
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://miresan-bible-institute.web.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_IDENTITY_DOMAIN
    value: id.miresan-bible-institute.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: miresan-bible-institute
    availability: [BUILD, RUNTIME]
  # App Check (reCAPTCHA Enterprise) — à renseigner une fois la clé créée
  # - variable: NEXT_PUBLIC_APP_CHECK_SITE_KEY
  #   value: <clé de site>
  #   availability: [BUILD]
